name: Axis images

# Builds the Axis fork's API (Rust, root Dockerfile) and web images,
# multi-arch, and pushes them to GHCR.
#   push to axis/main  -> axis-main, sha-<short>
#   tag v*-axis.*      -> <tag without the leading v>, sha-<short>
on:
  push:
    branches: ['axis/main']
    tags: ['v*-axis.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: axis-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/getindata/marquez
            context: .
            file: Dockerfile
          - image: ghcr.io/getindata/marquez-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=axis-main,enable=${{ github.ref == 'refs/heads/axis/main' }}
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
